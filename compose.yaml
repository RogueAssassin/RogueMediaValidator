services:
  roguemediavalidator:
    image: ${RMV_IMAGE:-ghcr.io/rogueassassin/roguemediavalidator:latest}
    # "missing" keeps a recreate working when the registry is unreachable (e.g. after a power
    # cut with no internet). ./update.sh always pulls explicitly.
    pull_policy: ${RMV_PULL_POLICY:-missing}
    container_name: roguemediavalidator
    restart: unless-stopped
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7811/healthz', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    env_file:
      - .env
    ports:
      # Set RMV_HTTP_BIND=127.0.0.1 when a reverse proxy on the same host/network fronts RMV.
      - "${RMV_HTTP_BIND:-0.0.0.0}:${RMV_HTTP_PORT:-7811}:7811"
    volumes:
      - roguemediavalidator-data:/data
    networks:
      media-net:
        aliases:
          - roguemediavalidator
          - rmv
    read_only: true
    tmpfs:
      - /tmp:size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: ${RMV_MEM_LIMIT:-512m}
    pids_limit: ${RMV_PIDS_LIMIT:-256}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      rogue.dashboard.protected: "true"
      rogue.product: "RogueMediaValidator"

volumes:
  roguemediavalidator-data:

networks:
  media-net:
    external: true
    name: ${RMV_NETWORK:-media-net}

x-podman:
  in_pod: false
