services:
  roguemediavalidator:
    image: ${RMV_IMAGE:-ghcr.io/rogueassassin/roguemediavalidator:testing}
    container_name: roguemediavalidator
    restart: unless-stopped
    env_file: .env
    ports:
      - "${RMV_HTTP_PORT:-7811}:7811"
    volumes:
      - roguemediavalidator-data:/data
    networks:
      - media-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  roguemediavalidator-data:

networks:
  media-net:
    external: true
